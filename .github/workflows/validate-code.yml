name: Validate Code

on: workflow_call

permissions:
  contents: read

jobs:
  called-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      - run: npm run ci:all
